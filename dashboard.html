<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Monitoring Dashboard - Starlink Status</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            overflow: hidden;
        }

        .container {
            width: 100vw;
            height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 2.5em;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header .logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
        }

        .header-info {
            text-align: right;
        }

        .last-update {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .status-summary {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 1em;
            font-weight: 600;
        }

        .status-badge.online {
            background: #10b981;
        }

        .status-badge.offline {
            background: #ef4444;
        }

        .status-badge.warning {
            background: #f59e0b;
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            padding: 10px;
        }

        .service-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: #10b981;
            transition: all 0.3s ease;
        }

        .service-card.offline::before {
            background: #ef4444;
        }

        .service-card.warning::before {
            background: #f59e0b;
        }

        .service-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .service-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .service-title {
            font-size: 1.5em;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .service-id {
            font-size: 0.9em;
            opacity: 0.7;
            font-family: 'Courier New', monospace;
        }

        .status-indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-indicator.online {
            background: #10b981;
            box-shadow: 0 0 20px #10b981;
        }

        .status-indicator.offline {
            background: #ef4444;
            box-shadow: 0 0 20px #ef4444;
            animation: none;
        }

        .status-indicator.warning {
            background: #f59e0b;
            box-shadow: 0 0 20px #f59e0b;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .service-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 0.85em;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 1.2em;
            font-weight: 600;
        }

        .signal-strength {
            margin-top: 15px;
        }

        .signal-bar {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            overflow: hidden;
            margin-top: 8px;
        }

        .signal-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981 0%, #059669 100%);
            transition: width 0.5s ease;
            border-radius: 5px;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            font-size: 2em;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-right: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid #ef4444;
            border-radius: 10px;
            padding: 20px;
            margin: 20px;
            text-align: center;
        }

        .footer {
            text-align: center;
            padding: 15px;
            opacity: 0.7;
            font-size: 0.9em;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>
                    <div class="logo">📡</div>
                    IT Monitoring Dashboard
                </h1>
            </div>
            <div class="header-info">
                <div class="last-update" id="lastUpdate">
                    Letzte Aktualisierung: --:--:--
                </div>
                <div class="status-summary">
                    <div class="status-badge online" id="onlineCount">
                        Online: 0
                    </div>
                    <div class="status-badge offline" id="offlineCount">
                        Offline: 0
                    </div>
                    <div class="status-badge warning" id="warningCount">
                        Warnung: 0
                    </div>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div id="content">
                <div class="loading">
                    <div class="spinner"></div>
                    <span>Lade Daten...</span>
                </div>
            </div>
        </div>

        <div class="footer">
            IT-Abteilung | Auto-Refresh alle 30 Sekunden
        </div>
    </div>

    <script>
        // API-Konfiguration
        const API_CONFIG = {
            baseUrl: 'https://portal.apps.castormarine.com/api',
            token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE3OTMxOTEzNzAsImlhdCI6MTc2MTY1NTM3MCwiaXNzIjoicG9ydGFsLmNhc3Rvci5ubCIsImp0aSI6IjkxMmQ3NGM0LTE5NWMtNGJjNS04OGZmLTI4OWYxM2VlYzhjMCIsInNjb3BlcyI6WyJhcGk6cmVhZCIsImFwaTp3cml0ZSJdLCJzdWIiOiJ3LmNyYW1lckByZWVkZXJlaS1mcmlzaWEuZGUifQ.3XunSuqGWOO7nlVKNP6cvOqx2DRWU2NWJ0fbE3xgdKc',
            refreshInterval: 30000 // 30 Sekunden
        };

        // Mock-Daten für Entwicklung/Tests (werden durch echte API-Daten ersetzt)
        const MOCK_DATA = [
            {
                id: 'SL-001',
                name: 'Starlink Terminal 1',
                status: 'online',
                location: 'Standort A',
                signalStrength: 95,
                uptime: '99.8%',
                latency: '25ms',
                downlink: '250 Mbps',
                uplink: '20 Mbps',
                lastSeen: new Date()
            },
            {
                id: 'SL-002',
                name: 'Starlink Terminal 2',
                status: 'online',
                location: 'Standort B',
                signalStrength: 87,
                uptime: '99.5%',
                latency: '32ms',
                downlink: '220 Mbps',
                uplink: '18 Mbps',
                lastSeen: new Date()
            },
            {
                id: 'SL-003',
                name: 'Starlink Terminal 3',
                status: 'warning',
                location: 'Standort C',
                signalStrength: 65,
                uptime: '95.2%',
                latency: '58ms',
                downlink: '150 Mbps',
                uplink: '12 Mbps',
                lastSeen: new Date()
            },
            {
                id: 'SL-004',
                name: 'Starlink Terminal 4',
                status: 'offline',
                location: 'Standort D',
                signalStrength: 0,
                uptime: '0%',
                latency: '--',
                downlink: '--',
                uplink: '--',
                lastSeen: new Date(Date.now() - 3600000)
            }
        ];

        let useMockData = false; // Auf true setzen für Entwicklung ohne API-Zugriff

        // Service Lines abrufen
        async function fetchServiceLines() {
            try {
                const response = await fetch(`${API_CONFIG.baseUrl}/service-lines`, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json, application/problem+json',
                        'Authorization': `Bearer ${API_CONFIG.token}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Fehler beim Abrufen der Daten:', error);
                // Fallback auf Mock-Daten bei Fehler
                if (!useMockData) {
                    console.warn('API nicht erreichbar, verwende Mock-Daten');
                    useMockData = true;
                }
                return MOCK_DATA;
            }
        }

        // Status basierend auf Signalstärke ermitteln
        function determineStatus(signalStrength) {
            if (signalStrength === 0) return 'offline';
            if (signalStrength < 70) return 'warning';
            return 'online';
        }

        // Service Card HTML generieren
        function createServiceCard(service) {
            const statusClass = service.status || determineStatus(service.signalStrength);
            const lastSeenText = service.lastSeen ?
                new Date(service.lastSeen).toLocaleString('de-DE') :
                'Unbekannt';

            return `
                <div class="service-card ${statusClass}">
                    <div class="service-header">
                        <div>
                            <div class="service-title">${service.name || 'Unbekannter Service'}</div>
                            <div class="service-id">${service.id || 'N/A'}</div>
                        </div>
                        <div class="status-indicator ${statusClass}"></div>
                    </div>

                    <div class="service-details">
                        <div class="detail-item">
                            <div class="detail-label">Standort</div>
                            <div class="detail-value">${service.location || 'Unbekannt'}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Uptime</div>
                            <div class="detail-value">${service.uptime || '--'}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Latenz</div>
                            <div class="detail-value">${service.latency || '--'}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Zuletzt gesehen</div>
                            <div class="detail-value">${lastSeenText}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Download</div>
                            <div class="detail-value">${service.downlink || '--'}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Upload</div>
                            <div class="detail-value">${service.uplink || '--'}</div>
                        </div>
                    </div>

                    <div class="signal-strength">
                        <div class="detail-label">Signalstärke: ${service.signalStrength || 0}%</div>
                        <div class="signal-bar">
                            <div class="signal-fill" style="width: ${service.signalStrength || 0}%"></div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Dashboard aktualisieren
        async function updateDashboard() {
            const contentDiv = document.getElementById('content');
            const lastUpdateDiv = document.getElementById('lastUpdate');

            try {
                const services = await fetchServiceLines();

                // Status-Zähler
                let onlineCount = 0;
                let offlineCount = 0;
                let warningCount = 0;

                services.forEach(service => {
                    const status = service.status || determineStatus(service.signalStrength);
                    if (status === 'online') onlineCount++;
                    else if (status === 'offline') offlineCount++;
                    else if (status === 'warning') warningCount++;
                });

                // Header aktualisieren
                document.getElementById('onlineCount').textContent = `Online: ${onlineCount}`;
                document.getElementById('offlineCount').textContent = `Offline: ${offlineCount}`;
                document.getElementById('warningCount').textContent = `Warnung: ${warningCount}`;

                // Services rendern
                if (services && services.length > 0) {
                    const servicesHtml = services.map(service => createServiceCard(service)).join('');
                    contentDiv.innerHTML = `<div class="services-grid">${servicesHtml}</div>`;
                } else {
                    contentDiv.innerHTML = '<div class="error-message">Keine Service-Lines gefunden</div>';
                }

                // Letzte Aktualisierung
                const now = new Date();
                lastUpdateDiv.textContent = `Letzte Aktualisierung: ${now.toLocaleTimeString('de-DE')}`;

            } catch (error) {
                console.error('Fehler beim Aktualisieren des Dashboards:', error);
                contentDiv.innerHTML = `
                    <div class="error-message">
                        <h2>Fehler beim Laden der Daten</h2>
                        <p>${error.message}</p>
                        <p>Verwende Mock-Daten zur Demonstration...</p>
                    </div>
                `;
                // Bei Fehler Mock-Daten verwenden
                useMockData = true;
                setTimeout(updateDashboard, 1000);
            }
        }

        // Initial laden
        updateDashboard();

        // Auto-Refresh
        setInterval(updateDashboard, API_CONFIG.refreshInterval);

        // Tastatur-Shortcuts
        document.addEventListener('keydown', (e) => {
            // F5 oder Strg+R für manuelles Refresh
            if (e.key === 'F5' || (e.ctrlKey && e.key === 'r')) {
                e.preventDefault();
                updateDashboard();
            }
            // M-Taste für Mock-Daten Toggle (Entwicklung)
            if (e.key === 'm' || e.key === 'M') {
                useMockData = !useMockData;
                console.log('Mock-Daten:', useMockData ? 'aktiviert' : 'deaktiviert');
                updateDashboard();
            }
        });
    </script>
</body>
</html>
